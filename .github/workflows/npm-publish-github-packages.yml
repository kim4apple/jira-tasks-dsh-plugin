# Publish dsh-jira-tasks to the public npm registry and to GitHub Packages
# when a release is created (or manually dispatched).
# The package IS the repository root (package.json + cordis.patch.yml + lib/),
# so that `dsh plugin add github:<owner>/jira-tasks-dsh-plugin` installs it.
# Requires the repository secret NPM_TOKEN (an npmjs.org access token).
#
# Fork note: the GitHub Packages step renames the package to
# @<owner>/dsh-jira-tasks using the repository owner, so a fork publishes into
# its own namespace instead of the upstream author's. The npmjs.org step still
# targets the unscoped `dsh-jira-tasks` name and therefore only succeeds for the
# account that owns that npm package.

name: Publish npm package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm install
      - name: Publish to npmjs.org
        run: |
          # 幂等：不要靠错误文案判断成败。同一个版本可能因为“本地已发过一次”、
          # 重跑、或并发 publish 而返回 403 "cannot publish over previously
          # published versions" / 409 "Cannot publish over previously staged
          # version"（v1.1.0 发版时就撞上最后这种，导致后面 GitHub Packages 那步
          # 被跳过）。这里以注册表里版本是否可见为唯一判据，并给它一点同步时间。
          npm publish 2>/tmp/npmjs-publish.log || true
          VERSION=$(node -p "require('./package.json').version")
          # npm 新版本可能先返回 202 再异步复制到读取端（v1.4.0 实测约 3~4 分钟），
          # 只等 60 秒会误判失败并跳过 GitHub Packages，这里放宽到最多 4 分钟。
          for attempt in $(seq 1 16); do
            if npm view "dsh-jira-tasks@${VERSION}" version >/dev/null 2>&1; then
              echo "npmjs.org: dsh-jira-tasks@${VERSION} is published"
              exit 0
            fi
            echo "npmjs.org: ${VERSION} not visible yet (attempt ${attempt}/16), retrying"
            sleep 15
          done
          echo "npmjs.org: dsh-jira-tasks@${VERSION} never became visible"
          cat /tmp/npmjs-publish.log
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to GitHub Packages
        run: |
          # GitHub npm 仓库只接受 @owner/name 作用域包名（无作用域会 404），
          # 这里按仓库 owner 改名（fork 时即 fork 自己的命名空间），不影响
          # npmjs.org 上的 dsh-jira-tasks
          npm pkg set name="@${{ github.repository_owner }}/dsh-jira-tasks"
          npm config set //npm.pkg.github.com/:_authToken "${GITHUB_TOKEN}"
          npm publish --registry https://npm.pkg.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
